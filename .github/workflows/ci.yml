name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versions épinglées. Trivy : ne jamais utiliser les versions 0.69.4 à 0.69.6 (compromises en mars 2026).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.72.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.18.4

jobs:
  backend:
    name: Backend (format, lint, tests, sécurité)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password-not-a-secret
      POSTGRES_DB: ci
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Formatage (black)
        run: black --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Typage (mypy, informatif)
        run: mypy app
        continue-on-error: true
      - name: Tests et couverture (>= 70 %)
        run: pytest -q --cov=app --cov-fail-under=70
      - name: Analyse statique de sécurité (bandit, niveau moyen et plus)
        run: bandit -q -r app ../worker/app -ll
      - name: Vulnérabilités des dépendances Python (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint, build, audit npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Vulnérabilités des dépendances npm
        run: npm audit --audit-level=high

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks sur tout l'historique
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect --source /repo --redact --no-banner

  docker:
    name: Images Docker (build et Trivy)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Construire les images
        run: |
          docker build -t netsentry-backend:ci backend
          docker build -f worker/Dockerfile -t netsentry-worker:ci .
          docker build -t netsentry-frontend:ci frontend
      - name: Trivy (bloque sur CRITICAL corrigeable)
        run: |
          for image in backend worker frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "netsentry-${image}:ci"
          done
