[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # la longueur de ligne est gérée par black

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["alembic/", "tests/"]

[tool.coverage.run]
omit = ["app/scripts/*"]