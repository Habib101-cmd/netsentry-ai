services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]          # aucun port publié (SEC-05)

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    networks: [internal, public]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    user: "1000:1000"
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]   # uniquement ce que Nmap exige (SEC-03)
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0
    networks: [internal, lab]

volumes:
  pgdata:

networks:
  internal:
    internal: true
  public:
  lab:
    external: true
    name: netsentry_lab