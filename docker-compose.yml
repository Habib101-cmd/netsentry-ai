services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]          # aucun port publié (SEC-05)

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, public]  # aucun port publié : joignable seulement via le proxy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    user: "1000:1000"
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]   # uniquement ce que Nmap exige (SEC-03)
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
    cpus: 1.0
    networks: [internal, lab]

  frontend:
    build:
      context: ./frontend
    cap_drop: [ALL]
    networks: [public]              # aucun port publié : joignable seulement via le proxy

  proxy:
    image: caddy:2-alpine
    ports: ["8443:8443"]            # seul point d'entrée exposé aux utilisateurs
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    security_opt: ["no-new-privileges:true"]
    networks: [public]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  public:
  lab:
    external: true
    name: netsentry_lab